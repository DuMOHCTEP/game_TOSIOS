<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lighting System Test</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            background: #000;
            color: white;
            font-family: Arial, sans-serif;
        }
        canvas {
            border: 2px solid #333;
            display: block;
            margin: 0 auto;
        }
        .controls {
            text-align: center;
            margin: 20px 0;
        }
        button {
            margin: 5px;
            padding: 10px 20px;
            background: #444;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        button:hover {
            background: #666;
        }
    </style>
</head>
<body>
    <h1>🕯️ Тестирование системы освещения</h1>
    <div class="controls">
        <button onclick="toggleLighting()">Включить/Выключить освещение</button>
        <button onclick="moveLight()">Переместить свет</button>
        <button onclick="addMonsterLight()">Добавить свет монстра</button>
    </div>
    <canvas id="gameCanvas" width="800" height="600"></canvas>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/pixi.js/6.5.8/pixi.min.js"></script>
    <script>
        // Тестовая сцена с освещением
        const app = new PIXI.Application({
            view: document.getElementById('gameCanvas'),
            width: 800,
            height: 600,
            backgroundColor: 0x0a0a0a, // Темный фон
            antialias: true
        });

        // Создаем карту (простой прямоугольник)
        const map = new PIXI.Graphics();
        map.beginFill(0x4a4a4a);
        map.drawRect(0, 0, 400, 400);
        map.endFill();
        map.x = 200;
        map.y = 100;
        app.stage.addChild(map);

        // Создаем игрока
        const player = new PIXI.Graphics();
        player.beginFill(0xff0000);
        player.drawCircle(0, 0, 10);
        player.endFill();
        player.x = 400;
        player.y = 300;
        app.stage.addChild(player);

        // Создаем монстра
        const monster = new PIXI.Graphics();
        monster.beginFill(0x00ff00);
        monster.drawCircle(0, 0, 8);
        monster.endFill();
        monster.x = 350;
        monster.y = 250;
        app.stage.addChild(monster);

        // Система освещения
        let lightingEnabled = true;
        const lightingContainer = new PIXI.Container();
        const darknessLayer = new PIXI.Graphics();
        const lightMask = new PIXI.Graphics();

        // Инициализация освещения
        function initLighting() {
            console.log('🏮 Инициализация освещения...');

            // Слой темноты
            darknessLayer.beginFill(0x000000, 0.7);
            darknessLayer.drawRect(-1000, -1000, 2000, 2000);
            darknessLayer.endFill();

            // Маска света (изначально всё темно)
            lightMask.beginFill(0x000000, 1.0);
            lightMask.drawRect(-1000, -1000, 2000, 2000);
            lightMask.endFill();

            lightingContainer.addChild(darknessLayer);
            darknessLayer.mask = lightMask;
            app.stage.addChild(lightingContainer);

            console.log('✅ Освещение инициализировано');
        }

        // Обновление освещения
        function updateLighting() {
            if (!lightingEnabled) return;

            lightMask.clear();

            // Всё темно
            lightMask.beginFill(0x000000, 1.0);
            lightMask.drawRect(-1000, -1000, 2000, 2000);
            lightMask.endFill();

            // Свет игрока
            lightMask.beginFill(0xffffff, 1.0);
            lightMask.drawCircle(player.x, player.y, 150);
            lightMask.endFill();

            // Яркий центр
            lightMask.beginFill(0xffffff, 1.0);
            lightMask.drawCircle(player.x, player.y, 45);
            lightMask.endFill();

            // Свет монстра
            lightMask.beginFill(0xffffff, 0.6);
            lightMask.drawCircle(monster.x, monster.y, 80);
            lightMask.endFill();

            // Позиционирование темноты
            darknessLayer.x = -player.x + 400;
            darknessLayer.y = -player.y + 300;
        }

        // Управление
        function toggleLighting() {
            lightingEnabled = !lightingEnabled;
            lightingContainer.visible = lightingEnabled;
            console.log('Освещение:', lightingEnabled ? 'ВКЛ' : 'ВЫКЛ');
        }

        function moveLight() {
            player.x = Math.random() * 600 + 100;
            player.y = Math.random() * 400 + 100;
            console.log(`Игрок перемещен: [${player.x.toFixed(0)}, ${player.y.toFixed(0)}]`);
        }

        function addMonsterLight() {
            monster.x = Math.random() * 500 + 150;
            monster.y = Math.random() * 300 + 150;
            console.log(`Монстр перемещен: [${monster.x.toFixed(0)}, ${monster.y.toFixed(0)}]`);
        }

        // Инициализация
        initLighting();

        // Игровой цикл
        app.ticker.add(() => {
            updateLighting();
        });

        console.log('🎮 Тестовая сцена загружена!');
        console.log('Используйте кнопки для тестирования освещения');
    </script>
</body>
</html>
